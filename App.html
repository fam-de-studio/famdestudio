<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Press Docket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  /* app chrome — a dark studio around a white sheet */
  --app-bg:#141714;
  --app-panel:#1B1F1B;
  --app-line:#2C312C;
  --app-ink:#E8E7E0;
  --app-dim:#8E938A;
  --brass:#C09A46;
  --brass-deep:#8A6820;

}

/* ---------- the document : dark by default, black & white for paper ---------- */
.sheet{
  --paper:#1A1E1B;
  --ink:#EDECE4;
  --ink-2:#B6BAB1;
  --ink-3:#8A8E85;
  --rule:#353A34;
  --rule-soft:#282D27;
  --docbrass:#D2AC60;
  --wash:rgba(210,172,96,.11);
}
html.doc-bw .sheet{
  --paper:#FFFFFF;
  --ink:#000000;
  --ink-2:#242424;
  --ink-3:#4C4C4C;
  --rule:#8A8A8A;
  --rule-soft:#C6C6C6;
  --docbrass:#000000;
  --wash:transparent;
}
*{box-sizing:border-box;}
html{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
body{
  margin:0;background:var(--app-bg);color:var(--app-ink);
  font-family:"Archivo","Helvetica Neue",Arial,sans-serif;font-size:13px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;}

/* ============================ APP SHELL ============================ */
.app{display:flex;flex-direction:column;height:100vh;}
.topbar{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:0 16px;height:56px;flex:0 0 56px;
  background:var(--app-panel);border-bottom:1px solid var(--app-line);
}
.brand{
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--app-dim);margin-right:8px;
}
.brand b{color:var(--brass);font-weight:600;}
.docsel{display:flex;gap:2px;background:#14171400;border:1px solid var(--app-line);border-radius:2px;padding:2px;}
.docsel button{
  background:transparent;border:0;color:var(--app-dim);cursor:pointer;border-radius:1px;
  font:500 10px/1 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.12em;
  text-transform:uppercase;padding:9px 13px;
}
.docsel button[aria-selected="true"]{background:var(--brass-deep);color:#fff;}
.spacer{margin-left:auto;}
.btn{
  background:transparent;border:1px solid var(--app-line);color:var(--app-ink);cursor:pointer;
  font:500 10px/1 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.12em;
  text-transform:uppercase;padding:10px 13px;border-radius:2px;
}
.btn:hover{border-color:var(--brass);color:var(--brass);}
.btn-go{background:var(--brass-deep);border-color:var(--brass-deep);color:#fff;}
.btn-go:hover{background:var(--brass);border-color:var(--brass);color:#141714;}
.link{background:none;border:0;color:var(--brass);cursor:pointer;font:inherit;text-decoration:underline;padding:0;}

.state{
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--app-dim);border:1px solid var(--app-line);
  padding:6px 9px;border-radius:2px;white-space:nowrap;
}
.state.live{color:#7FB27F;border-color:#31452F;}
.state.demo{color:var(--brass);border-color:#42381F;}

.main{flex:1;display:grid;grid-template-columns:392px 1fr;min-height:0;}

/* ============================ INPUT PANEL ============================ */
.panel{
  background:var(--app-panel);border-right:1px solid var(--app-line);
  overflow-y:auto;padding-bottom:150px;
}
.sec{border-bottom:1px solid var(--app-line);}
.sec>summary{
  list-style:none;cursor:pointer;padding:13px 16px;display:flex;align-items:center;gap:9px;
  font:600 10px/1 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.15em;text-transform:uppercase;
  color:var(--app-dim);
}
.sec>summary::-webkit-details-marker{display:none;}
.sec>summary::before{content:"+";color:var(--brass);font-size:12px;width:10px;}
.sec[open]>summary::before{content:"–";}
.sec[open]>summary{color:var(--brass);}
.secbody{padding:2px 16px 18px;display:grid;gap:11px;}
.f{display:grid;gap:5px;}
.f>label{
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--app-dim);
}
.f input,.f select,.f textarea{
  width:100%;background:#141714;border:1px solid var(--app-line);color:var(--app-ink);
  padding:9px 10px;border-radius:2px;font:400 13px/1.4 "Archivo",Arial,sans-serif;
}
.f input[type=number]{font-family:"IBM Plex Mono",ui-monospace,monospace;text-align:right;}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--brass);}
.f textarea{resize:vertical;min-height:56px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px;}
.hintline{font-size:11px;color:var(--app-dim);line-height:1.5;}
.callout{
  margin:14px 16px 4px;padding:14px 15px;border:1px solid var(--brass);
  background:rgba(192,154,70,.09);border-radius:2px;display:grid;gap:10px;justify-items:start;
}
.callout p{margin:0;font-size:12px;line-height:1.55;color:var(--app-ink);}
.callout b{color:var(--brass);}
.hintline b{color:var(--brass);font-weight:500;}

.toggles{display:flex;flex-wrap:wrap;gap:6px;}
.tg{
  border:1px solid var(--app-line);background:transparent;color:var(--app-dim);cursor:pointer;
  font:500 9.5px/1 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.08em;
  text-transform:uppercase;padding:8px 10px;border-radius:2px;
}
.tg[aria-pressed="true"]{border-color:var(--brass);background:rgba(192,154,70,.12);color:var(--brass);}

.readout{
  position:fixed;bottom:0;left:0;width:392px;background:#101310;
  border-top:1px solid var(--app-line);border-right:1px solid var(--app-line);
  padding:12px 16px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;
}
.ro{min-width:0;}
.ro span{
  display:block;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:8.5px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--app-dim);margin-bottom:3px;
}
.ro b{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:14px;font-weight:500;
  font-variant-numeric:tabular-nums;}
.ro.hero b{color:var(--brass);font-size:19px;}
.ro.warn b{color:#D98B6A;}

/* ============================ DOCUMENT STAGE ============================ */
.stage{overflow-y:auto;padding:28px 28px 70px;background:#0D0F0D;}
.sheet{
  max-width:840px;margin:0 auto;background:var(--paper);color:var(--ink);
  padding:56px 60px 50px;position:relative;border:1px solid #2B302B;
  box-shadow:0 22px 54px -22px rgba(0,0,0,.85);
}
.sheet[hidden]{display:none;}
.reg{position:absolute;width:14px;height:14px;opacity:.55;}
.reg-tl{top:15px;left:15px;border-top:1px solid var(--docbrass);border-left:1px solid var(--docbrass);}
.reg-tr{top:15px;right:15px;border-top:1px solid var(--docbrass);border-right:1px solid var(--docbrass);}
.reg-bl{bottom:15px;left:15px;border-bottom:1px solid var(--docbrass);border-left:1px solid var(--docbrass);}
.reg-br{bottom:15px;right:15px;border-bottom:1px solid var(--docbrass);border-right:1px solid var(--docbrass);}

.mast{display:flex;justify-content:space-between;align-items:flex-start;gap:36px;}
.wordmark{font-family:"Bodoni Moda",Georgia,serif;font-size:29px;font-weight:500;line-height:1.06;margin:0 0 7px;}
.tagline{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--docbrass);}
.issuer{margin-top:8px;font-size:11.5px;color:var(--ink-3);line-height:1.65;}
.dt{text-align:right;flex:0 0 auto;}
.dt h2{font-family:"Bodoni Moda",Georgia,serif;font-size:14px;font-weight:600;letter-spacing:.3em;
  text-transform:uppercase;margin:0 0 11px;color:var(--docbrass);}
.meta{display:grid;grid-template-columns:auto auto;gap:3px 15px;justify-content:end;}
.meta dt{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:8.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);text-align:right;padding-top:2px;}
.meta dd{margin:0;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11.5px;
  font-variant-numeric:tabular-nums;text-align:right;}

.hr{height:1px;background:var(--rule);margin:24px 0;}
.hrb{height:2px;background:linear-gradient(90deg,var(--docbrass) 0%,var(--docbrass) 46%,var(--rule) 100%);margin:24px 0;}
.eyebrow{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:8.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink-3);margin:0 0 13px;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:36px;}
.pname{font-size:15px;font-weight:600;margin:0 0 4px;}
.pline{font-size:12px;color:var(--ink-2);line-height:1.7;}

.spec{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--rule-soft);}
.spec>div{padding:12px 16px 12px 0;border-bottom:1px solid var(--rule-soft);}
.spec>div.w2{grid-column:span 2;}
.spec>div.w3{grid-column:1 / -1;}
.spec dt{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:8.5px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:4px;}
.spec dd{margin:0;font-size:13px;font-weight:500;line-height:1.4;}

.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9.5px;letter-spacing:.08em;
  text-transform:uppercase;padding:7px 11px;border:1px solid var(--docbrass);
  background:var(--wash);color:var(--docbrass);font-weight:500;}

.comm{border-top:2px solid var(--ink);border-bottom:1px solid var(--rule);padding:20px 0 18px;
  display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:24px;align-items:end;}
.fig dt{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:8.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:6px;}
.fig dd{margin:0;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:18px;
  font-variant-numeric:tabular-nums;}
.fig.tot{text-align:right;}
.fig.tot dt{color:var(--docbrass);}
.fig.tot dd{font-family:"Bodoni Moda",Georgia,serif;font-size:36px;font-weight:500;line-height:1;
  color:var(--docbrass);}
.tier{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:24px;align-items:center;
  padding:12px 0;border-bottom:1px solid var(--rule-soft);}
.tier .l{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-3);}
.tier .m{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12.5px;font-variant-numeric:tabular-nums;}
.tier .r{text-align:right;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:14px;
  font-weight:600;font-variant-numeric:tabular-nums;}
.note{margin:10px 0 0;font-size:11.5px;color:var(--ink-3);max-width:64ch;line-height:1.6;}
.pgbreak{display:none;}

.terms{display:grid;grid-template-columns:1fr 1fr;gap:0 40px;}
.terms>div{padding:10px 0;border-bottom:1px solid var(--rule-soft);}
.terms dt{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:8.5px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:4px;}
.terms dd{margin:0;font-size:12px;line-height:1.55;color:var(--ink-2);}

.close{margin-top:28px;display:flex;justify-content:space-between;align-items:flex-end;gap:36px;}
.close p{margin:0;font-size:12px;color:var(--ink-2);max-width:54ch;line-height:1.7;}
.sign{flex:0 0 210px;text-align:right;}
.sign .l{height:1px;background:var(--ink);margin-bottom:6px;}
.sign span{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:8.5px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--ink-3);}

.goods{width:100%;border-collapse:collapse;}
.goods th{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:8.5px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--ink-3);text-align:left;padding:0 12px 8px 0;
  border-bottom:1px solid var(--ink);font-weight:500;}
.goods th.r,.goods td.r{text-align:right;padding-right:0;}
.goods td{padding:14px 12px 14px 0;border-bottom:1px solid var(--rule-soft);font-size:12.5px;vertical-align:top;}
.goods td.n{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;}
.goods .sub{display:block;font-size:11px;color:var(--ink-3);margin-top:3px;line-height:1.5;}

.pay{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-top:20px;}
.pay>div{border:1px solid var(--rule);padding:15px 16px;}
.pay>div.due{border:1.5px solid var(--docbrass);background:var(--wash);}
.pay dt{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:8.5px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:5px;}
.pay>div.due dt{color:var(--docbrass);}
.pay dd{margin:0;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:19px;font-variant-numeric:tabular-nums;}
.pay .w{display:block;font-family:"Archivo",Arial,sans-serif;font-size:11px;color:var(--ink-3);margin-top:4px;}

.bank{display:grid;grid-template-columns:1fr 1fr;gap:0 36px;}
.bank>div{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid var(--rule-soft);}
.bank>div>span:first-child{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:8.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);padding-top:3px;}
.bank>div>span:last-child{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;}

.cond{margin:0;padding:0;list-style:none;counter-reset:c;}
.cond li{counter-increment:c;position:relative;padding:7px 0 7px 30px;font-size:12px;
  color:var(--ink-2);line-height:1.6;}
.cond li::before{content:counter(c,decimal-leading-zero);position:absolute;left:0;top:8px;
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9px;color:var(--docbrass);}

/* ============================ MODALS ============================ */
.scrim{position:fixed;inset:0;background:rgba(8,10,8,.72);display:flex;align-items:center;
  justify-content:center;padding:24px;z-index:50;}
.scrim[hidden]{display:none;}
.modal{background:var(--app-panel);border:1px solid var(--app-line);width:100%;max-width:840px;
  max-height:88vh;display:flex;flex-direction:column;border-radius:3px;}
.modal header{display:flex;align-items:center;gap:12px;padding:15px 20px;border-bottom:1px solid var(--app-line);}
.modal header h3{margin:0;font:600 11px/1 "IBM Plex Mono",ui-monospace,monospace;
  letter-spacing:.16em;text-transform:uppercase;color:var(--brass);}
.modal .body{overflow-y:auto;padding:20px;display:grid;gap:14px;}
.modal footer{padding:14px 20px;border-top:1px solid var(--app-line);display:flex;gap:8px;justify-content:flex-end;}
.qrow{display:grid;grid-template-columns:100px 1fr 110px 30px;gap:12px;align-items:center;
  padding:11px 12px;border:1px solid var(--app-line);cursor:pointer;border-radius:2px;}
.qrow:hover{border-color:var(--brass);}
.qrow .no{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;color:var(--brass);}
.qrow .cl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.qrow .pr{font-size:11px;color:var(--app-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.qrow .v{text-align:right;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;}
.qrow .st{text-align:right;font-size:10px;color:var(--app-dim);}
.del{background:none;border:0;color:var(--app-dim);cursor:pointer;font-size:15px;line-height:1;}
.del:hover{color:#D98B6A;}
.rtab{width:100%;border-collapse:collapse;}
.rtab th{font:500 9px/1 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.12em;
  text-transform:uppercase;color:var(--app-dim);text-align:left;padding:0 10px 8px 0;}
.rtab td{padding:4px 10px 4px 0;}
.rtab input{width:100%;background:#141714;border:1px solid var(--app-line);color:var(--app-ink);
  padding:7px 9px;border-radius:2px;font:400 12px/1.3 "Archivo",Arial,sans-serif;}
.rtab input.n{font-family:"IBM Plex Mono",ui-monospace,monospace;text-align:right;}
.rtab input:focus{outline:none;border-color:var(--brass);}
.grp{border:1px solid var(--app-line);padding:16px;border-radius:2px;}
.grp>h4{margin:0 0 12px;font:600 9.5px/1 "IBM Plex Mono",ui-monospace,monospace;
  letter-spacing:.15em;text-transform:uppercase;color:var(--brass);}

.toast{position:fixed;bottom:22px;right:22px;background:var(--brass-deep);color:#fff;
  padding:13px 20px;border-radius:2px;z-index:80;
  font:500 11px/1 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;}
.toast[hidden]{display:none;}

/* ============================ PRINT — keeps the colour ============================ */
/* margin 0 so the page ground reaches every edge; the inset is the sheet's own padding */
@page{size:A4;margin:0;}
@media print{
  html{background:#1A1E1B;}
  html.doc-bw{background:#FFFFFF;}
  .topbar,.panel,.readout,.scrim,.toast{display:none !important;}
  .app{display:block;height:auto;}
  .main{display:block;}
  .stage{overflow:visible;padding:0;background:transparent;}
  body{background:transparent;font-size:9.6pt;}
  .sheet{max-width:none;margin:0;padding:15mm 14mm;box-shadow:none;border:0;background:transparent;}
  /* the document always breaks in the same designed place, and the new page
     opens with the same top inset as the first */
  .pgbreak{display:block;height:15mm;break-before:page;page-break-before:always;}
  .sheet[hidden]{display:none !important;}
  .reg{display:none;}
  .eyebrow{break-after:avoid;page-break-after:avoid;margin-bottom:10px;}
  .mast,.comm,.tier,.two,.pay,.pay>div,.close,.spec>div,.terms>div,.bank>div,
  .goods tr,.cond li{break-inside:avoid;page-break-inside:avoid;}
  p,dd,li{orphans:3;widows:3;}
  .hr,.hrb{margin:17px 0;}
  .wordmark{font-size:19pt;}
  .issuer{font-size:8.6pt;}
  .dt h2{font-size:11pt;}
  .meta dd{font-size:9.4pt;}
  .pname{font-size:11.5pt;}
  .pline{font-size:9pt;}
  .spec>div{padding:9px 14px 9px 0;}
  .spec dd{font-size:9.5pt;}
  .comm{padding:14px 0 12px;}
  .fig dd{font-size:14pt;}
  .fig.tot dd{font-size:26pt;}
  .note{font-size:8.6pt;}
  .terms>div{padding:7px 0;}
  .terms dd{font-size:8.8pt;}
  .close{margin-top:20px;}
  .close p{font-size:8.8pt;}
  .goods td{padding:11px 12px 11px 0;font-size:9.5pt;}
  .pay dd{font-size:15pt;}
  .cond li{padding:5px 0 5px 28px;font-size:8.8pt;}
}
@media (max-width:1080px){
  .main{grid-template-columns:1fr;}
  .panel{max-height:52vh;}
  .readout{width:100%;}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important;}}
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="brand"><b>Press Docket</b></div>
    <div class="docsel" role="tablist">
      <button role="tab" aria-selected="true" data-doc="quote">Quotation</button>
      <button role="tab" aria-selected="false" data-doc="pi">Proforma Invoice</button>
    </div>
    <div class="spacer"></div>
    <div class="state" id="state">connecting…</div>
    <button class="btn" id="b-new">New</button>
    <button class="btn" id="b-open">Open</button>
    <button class="btn" id="b-rates">Rates</button>
    <button class="btn" id="b-settings">My company</button>
    <button class="btn" id="b-mail">Email</button>
    <button class="btn" id="b-save">Save</button>
    <button class="btn" id="b-print" title="Black &amp; white, for paper">Print B&amp;W</button>
    <button class="btn btn-go" id="b-pdf" title="Dark PDF, for sending to the client">PDF</button>
  </div>

  <div class="main">
    <aside class="panel" id="panel"></aside>
    <section class="stage">
      <article class="sheet" id="doc-quote"></article>
      <article class="sheet" id="doc-pi" hidden></article>
    </section>
  </div>

  <div class="readout" id="readout"></div>
</div>

<div class="scrim" id="scrim" hidden><div class="modal" id="modal"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(function () {

function todayISO(){
  var d = new Date();
  return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2);
}
function prettyDate(iso){
  if(!iso) return '';
  var p = String(iso).split('-');
  if(p.length !== 3) return String(iso);
  var m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return Number(p[2]) + ' ' + m[Number(p[1])-1] + ' ' + p[0];
}
function n(v){ var x = parseFloat(v); return isFinite(x) ? x : 0; }
function esc(s){
  return String(s === undefined || s === null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function int(v){ return Math.round(n(v)).toLocaleString('en-US'); }
function usd(v, dp){
  dp = dp === undefined ? 2 : dp;
  return '$' + n(v).toLocaleString('en-US',{minimumFractionDigits:dp, maximumFractionDigits:dp});
}
function unitStr(v){
  var s = usd(v, 4);
  if(s.indexOf('.') > -1) s = s.replace(/0+$/,'').replace(/\.$/,'');
  return s;
}
function pkr(v){ return n(v).toLocaleString('en-US',{maximumFractionDigits:0}); }

/* ====================== COSTING ENGINE ====================== */
/* Pure — no DB, no job global, no DOM. tools/test-engine.mjs extracts and
   verifies everything between the markers before every clasp push. */
/* ENGINE-START */
function n_(v){ var x = parseFloat(v); return isFinite(x) ? x : 0; }
function rateOf(ctx, k, fb){ var v = ctx.rates[k]; return (v === undefined || v === '' || v === null) ? n_(fb) : n_(v); }
function boardRate(ctx, name){ for(var i=0;i<ctx.boards.length;i++) if(ctx.boards[i].name === name) return n_(ctx.boards[i].pkr_per_kg); return 0; }
function filmRate(ctx, name){ for(var i=0;i<ctx.films.length;i++) if(ctx.films[i].name === name) return n_(ctx.films[i].pkr_per_sqin); return 0; }

function imposition(job){
  var ew = n_(job.psw) - n_(job.trim_w), eh = n_(job.psh) - n_(job.trim_h);
  var fw = n_(job.flat_w), fh = n_(job.flat_h);
  if(fw <= 0 || fh <= 0 || ew <= 0 || eh <= 0) return {ew:ew, eh:eh, ups:0};
  var a = Math.floor(ew/fw) * Math.floor(eh/fh);
  var b = Math.floor(ew/fh) * Math.floor(eh/fw);
  return {ew:ew, eh:eh, ups:Math.max(a,b)};
}

/* Full recost at any quantity. */
function costForQty(job, ctx, qty){
  var imp = imposition(job), ups = imp.ups;
  if(ups <= 0 || qty <= 0){
    return {ups:0, gross:0, parts:{}, direct:0, total:0, perPc:0, exw:0, exwPc:0,
            freight:0, bankFee:0, cbmAuto:0, dap:0, duty:0, vat:0, ddp:0, ddpPc:0, profit:0, kgTotal:0, boxKg:0};
  }
  var net = Math.ceil(qty/ups);
  var gross = Math.ceil(net * (1 + rateOf(ctx,'waste',0.07))) + rateOf(ctx,'setup_sheets',200);
  var kgSheet = (n_(job.psw)*n_(job.psh)/1e6) * n_(job.gsm) / 1000;
  var area = (n_(job.psw)/25.4) * (n_(job.psh)/25.4);
  var plates = n_(job.col_f) + n_(job.col_b);

  /* Repeat orders reuse existing tooling: plates, die, blocks, setups and the
     proof are already made and must not be charged again. Running charges stay. */
  var rep = job.repeat === 'Yes';
  var c = {
    board: gross * kgSheet * boardRate(ctx, job.board),
    plates: rep ? 0 : plates * rateOf(ctx,'plate',1200),
    print: gross/1000 * rateOf(ctx,'print',900) * plates,
    proof: rep ? 0 : rateOf(ctx,'proof',3500),
    lam:   gross * area * filmRate(ctx, job.lam),
    uv:    job.uv === 'Yes' ? (rep ? 0 : rateOf(ctx,'uv_setup',3000)) + gross * rateOf(ctx,'uv_run',3.5) : 0,
    foil:  job.foil === 'Yes' ? (rep ? 0 : n_(job.foil_area) * rateOf(ctx,'foil_block',45)) + gross * rateOf(ctx,'foil_run',2.5) : 0,
    emb:   job.emb === 'Yes' ? (rep ? 0 : n_(job.emb_area) * rateOf(ctx,'emb_block',60)) + gross * rateOf(ctx,'emb_run',2) : 0,
    die:   rep ? 0 : n_(job.die_cost),
    dc:    gross/1000 * rateOf(ctx,'dc_run',1800),
    paste: qty * rateOf(ctx,'paste',2.5),
    pack:  qty * rateOf(ctx,'pack',1.5),
    other: n_(job.other_pkr),
    tr:    n_(job.local_tr)
  };
  /* Per-job overrides: a typed PKR amount replaces the auto-computed line.
     Zero is a legitimate override (e.g. client supplies the board). */
  var ov = job.overrides || {};
  for(var ok_ in c){
    if(ov[ok_] !== undefined && ov[ok_] !== null && ov[ok_] !== '') c[ok_] = n_(ov[ok_]);
  }
  var direct = 0;
  for(var k in c) direct += c[k];
  /* No factory overhead — the broker's compensation is the margin, nothing hidden. */
  var total = direct;

  var margin = rateOf(ctx,'margin',0.4), fx = rateOf(ctx,'fx',285);
  var exw = (margin >= 1 || fx <= 0) ? 0 : total / (1 - margin) / fx;

  var boxKg = (n_(job.flat_w) * n_(job.flat_h) / 1e6) * n_(job.gsm) / 1000;
  var grossKg = boxKg * qty * (1 + n_(job.pack_pct));
  /* Flat-pack sea volume from the cargo itself: flat area x board thickness
     (~ gsm/800000 m; 350gsm ~ 0.44mm), scaled by the same packing allowance
     as weight. A typed override wins for odd cargo. */
  var cbmAuto = (n_(job.flat_w)/1000) * (n_(job.flat_h)/1000) * (n_(job.gsm)/800000) * qty * (1 + n_(job.pack_pct));
  var cbmUsed = (job.cbm_override !== undefined && job.cbm_override !== null && job.cbm_override !== '')
    ? n_(job.cbm_override) : cbmAuto;
  var freight = job.mode === 'Sea LCL' ? cbmUsed * rateOf(ctx,'fr_sea',180)
              : job.mode === 'DHL Express' ? grossKg * rateOf(ctx,'fr_dhl',9)
              : grossKg * rateOf(ctx,'fr_air',5.5);
  var docs = rateOf(ctx,'docs',120);
  /* The bank charges on the whole invoice, not just the goods. */
  var bankFee = (exw + freight + docs) * rateOf(ctx,'bank_pct',0.02);

  /* DAP: delivered, duties unpaid — the buyer's courier collects any duty/VAT.
     DDP: we price destination duty (on CIF) and VAT (on CIF + duty) into the
     quote, so "no further charges on arrival" is finally true. */
  var dap = exw + freight + docs + bankFee;
  var duty = 0, vat = 0;
  if(job.incoterm === 'DDP'){
    duty = n_(job.duty_pct) * (exw + freight);
    vat  = n_(job.vat_pct) * (exw + freight + duty);
  }
  var landed = dap + duty + vat;

  return {
    ups:ups, gross:gross, parts:c, direct:direct, total:total, perPc:total/qty,
    exw:exw, exwPc:exw/qty, freight:freight, bankFee:bankFee, cbmAuto:cbmAuto,
    dap:dap, duty:duty, vat:vat,
    ddp:landed, ddpPc:landed/qty, profit:fx > 0 ? exw - total/fx : 0,
    kgTotal:grossKg, boxKg:boxKg
  };
}

function computeCost(job, ctx){ return costForQty(job, ctx, n_(job.qty)); }
/* ENGINE-END */

function ctx_(){ return {rates: DB.rates, boards: DB.boards, films: DB.films}; }

function calc(){
  var m = computeCost(job, ctx_());
  var b = costForQty(job, ctx_(), n(job.qty2));
  m.unit2 = job.unit2_auto === 'Yes' ? b.ddpPc : n(job.unit2);
  m.unit2Auto = b.ddpPc;
  m.total2 = n(job.qty2) * m.unit2;
  m.marginPct = m.ddp > 0 ? m.profit / m.ddp : 0;
  return m;
}

function finishList(){
  var out = [];
  if(job.foil === 'Yes') out.push('Hot foil');
  if(job.uv === 'Yes') out.push('Drip-off / spot UV');
  if(job.emb === 'Yes') out.push('Emboss / deboss');
  if(job.lam && job.lam !== 'None') out.push(job.lam);
  (job.extras || []).forEach(function(e){ out.push(e); });
  return out;
}

function fieldHtml(k, label, type, opts, extra){
  var v = job[k];
  var id = 'i_' + k;
  var h = '<div class="f"><label for="'+id+'">'+esc(label)+'</label>';
  if(type === 'select'){
    var list = opts === 'boards' ? DB.boards.map(function(b){return b.name;})
             : opts === 'films' ? DB.films.map(function(f){return f.name;})
             : opts;
    h += '<select id="'+id+'" data-k="'+k+'">';
    if(list.indexOf(v) === -1 && v) h += '<option value="'+esc(v)+'" selected>'+esc(v)+'</option>';
    list.forEach(function(o){
      h += '<option value="'+esc(o)+'"'+(o === v ? ' selected' : '')+'>'+esc(o)+'</option>';
    });
    h += '</select>';
  } else if(type === 'area'){
    h += '<textarea id="'+id+'" data-k="'+k+'">'+esc(v)+'</textarea>';
  } else if(type === 'num'){
    h += '<input id="'+id+'" data-k="'+k+'" type="number" step="'+(extra && extra.step ? extra.step : 'any')+'" value="'+esc(v)+'">';
  } else if(type === 'date'){
    h += '<input id="'+id+'" data-k="'+k+'" type="date" value="'+esc(v)+'">';
  } else {
    h += '<input id="'+id+'" data-k="'+k+'" type="text" value="'+esc(v)+'"'
       + (extra && extra.list ? ' list="'+extra.list+'"' : '')
       + (extra && extra.ph ? ' placeholder="'+esc(extra.ph)+'"' : '') + '>';
  }
  return h + '</div>';
}

/* ====================== BINDING ====================== */
document.getElementById('panel').addEventListener('toggle', function(e){
  var d = e.target;
  if(!d || !d.classList || !d.classList.contains('sec')) return;
  SEC_OPEN[d.getAttribute('data-sec')] = d.open;
  try{ localStorage.setItem('press-docket-sections', JSON.stringify(SEC_OPEN)); }catch(err){}
}, true);

document.getElementById('panel').addEventListener('input', function(e){
  var ovk = e.target.getAttribute('data-ov');
  if(ovk){
    job.overrides = job.overrides || {};
    if(e.target.value === '') delete job.overrides[ovk];
    else job.overrides[ovk] = n(e.target.value);
    renderAll(); return;
  }
  var vdk = e.target.getAttribute('data-vd');
  if(vdk){
    job.vendors = job.vendors || {};
    if(e.target.value === '') delete job.vendors[vdk]; else job.vendors[vdk] = e.target.value;
    return; /* names don't change money — no re-render, keeps focus */
  }
  var k = e.target.getAttribute('data-k');
  if(!k) return;
  job[k] = (e.target.type === 'number') ? n(e.target.value) : e.target.value;
  if(k === 'client_name') fillClient(e.target.value);
  renderAll();
});
document.getElementById('panel').addEventListener('change', function(e){
  var k = e.target.getAttribute('data-k');
  if(k && e.target.tagName === 'SELECT'){ job[k] = e.target.value; renderAll(); }
});
document.getElementById('panel').addEventListener('click', function(e){
  var tg = e.target.closest('[data-tg]');
  if(tg){
    var k = tg.getAttribute('data-tg');
    job[k] = job[k] === 'Yes' ? 'No' : 'Yes';
    tg.setAttribute('aria-pressed', job[k] === 'Yes');
    renderAll(); return;
  }
  var ex = e.target.closest('[data-extra]');
  if(ex){
    var name = ex.getAttribute('data-extra');
    job.extras = job.extras || [];
    var i = job.extras.indexOf(name);
    if(i > -1) job.extras.splice(i,1); else job.extras.push(name);
    ex.setAttribute('aria-pressed', i === -1);
    renderAll(); return;
  }
  var act = e.target.closest('[data-act]');
  if(act) ACTIONS[act.getAttribute('data-act')]();
});

function fillClient(name){
  for(var i=0;i<DB.clients.length;i++){
    if(DB.clients[i].name === name){
      var c = DB.clients[i];
      job.client_contact = c.contact || '';
      job.client_country = c.country || '';
      job.client_email = c.email || '';
      job.client_address = c.address || '';
      ['client_contact','client_country','client_email','client_address'].forEach(function(k){
        var el = document.getElementById('i_' + k);
        if(el) el.value = job[k];
      });
      return;
    }
  }
}

function isPlaceholderCompany(){
  var c = String(DB.settings.company || '').trim();
  return c === '' || c === DEFAULT_SETTINGS.company;
}

var ACTIONS = {
  openSettings: function(){ document.getElementById('b-settings').click(); },
  autoFlat: function(){
    job.flat_w = 2*(n(job.len)+n(job.wid)) + n(job.flap);
    job.flat_h = n(job.hgt) + 2*n(job.wid);
    document.getElementById('i_flat_w').value = job.flat_w;
    document.getElementById('i_flat_h').value = job.flat_h;
    renderAll();
    toast('Flat size calculated');
  },
  saveClient: function(){
    if(!job.client_name){ toast('Add a client name first'); return; }
    var c = {name:job.client_name, contact:job.client_contact, country:job.client_country,
             email:job.client_email, address:job.client_address};
    call('saveClient', c, function(list){
      DB.clients = list || DB.clients;
      var i, found = false;
      for(i=0;i<DB.clients.length;i++) if(DB.clients[i].name === c.name) found = true;
      if(!found) DB.clients.push(c);
      persistDemo();
      toast('Client saved');
    });
  },
  newPi: function(){
    if(LIVE){
      google.script.run.withSuccessHandler(function(no){
        job.pi_no = no;
        document.getElementById('i_pi_no').value = no;
        renderAll(); toast('PI number ' + no);
      }).nextPiNumber();
    } else {
      var next = n(DB.settings.pi_next || 1);
      job.pi_no = (DB.settings.pi_prefix || 'PI-') + ('000' + next).slice(-3);
      DB.settings.pi_next = next + 1;
      document.getElementById('i_pi_no').value = job.pi_no;
      persistDemo(); renderAll(); toast('PI number ' + job.pi_no);
    }
  }
};

  var label = activeDoc === 'pi' ? (job.pi_no || 'Proforma-Invoice') : (job.quote_no || 'Quotation');

  toast(bw ? 'Choose your printer · colour: black & white'
           : 'Choose destination: Save as PDF');

      document.title = t;

document.getElementById('b-save').addEventListener('click', function(){
  if(!job.client_name){ toast('Add a client name first'); return; }
  var m = calc();
  job.ups = m.ups; job.gross = m.gross;
  job.cost_total = Math.round(m.total); job.cost_pc = Number(m.perPc.toFixed(2));
  job.exw = Number(m.exw.toFixed(2)); job.freight = Number(m.freight.toFixed(2));
  job.ddp = Number(m.ddp.toFixed(2)); job.ddp_pc = Number(m.ddpPc.toFixed(4));
  job.profit = Number(m.profit.toFixed(2));
  job.unit2 = Number(m.unit2.toFixed(4));
  job.fx_used = rateOf(ctx_(),'fx',285); job.margin_used = rateOf(ctx_(),'margin',0.4);

  if(LIVE){
    google.script.run.withSuccessHandler(function(r){

      DB.quotes = r.quotes;

      job.quote_no = (DB.settings.quote_prefix || 'QT-') + ('000' + nx).slice(-3);
      DB.settings.quote_next = nx + 1;
    }
    DB.quotes = (DB.quotes || []).filter(function(q){ return q.quote_no !== job.quote_no; });
    DB.quotes.unshift({quote_no:job.quote_no, date:job.date, status:job.status,
      client_name:job.client_name, product:job.product, qty:job.qty, ddp:job.ddp});
    DB.saved = DB.saved || {};

    persistDemo();
    var el2 = document.getElementById('i_quote_no'); if(el2) el2.value = job.quote_no;

    toast(job.quote_no + ' saved');

});

    var num = row.getAttribute('data-no');
    if(LIVE){
      google.script.run.withSuccessHandler(function(o){
        if(!o){ toast('Not found'); return; }
        applyLoaded(o); closeModal(); toast(num + ' opened');
      }).loadQuote(num);
    } else {
      var o = (DB.saved || {})[num];
      if(!o){ toast('Not found'); return; }
      applyLoaded(o); closeModal(); toast(num + ' opened');
    }
  });
});

function applyLoaded(o){
  var base = blankJob();
  Object.keys(base).forEach(function(k){
    if(o[k] !== undefined && o[k] !== '') base[k] = o[k];
  });
  if(typeof base.extras === 'string') base.extras = base.extras ? base.extras.split('|') : [];
  if(!Array.isArray(base.extras)) base.extras = [];
  ['overrides','vendors'].forEach(function(k){
    if(typeof base[k] === 'string' && base[k]){ try{ base[k] = JSON.parse(base[k]); }catch(e){ base[k] = {}; } }
    if(!base[k] || typeof base[k] !== 'object' || Array.isArray(base[k])) base[k] = {};
  });
  base.quote_no = o.quote_no || '';
  base.pi_no = o.pi_no || '';
  base.po_ref = o.po_ref || '';
  base.notes = o.notes || '';
  job = base;
  renderPanel(); renderAll();
}

/* ====================== TOAST ====================== */
var toastEl = document.getElementById('toast'), toastT;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.hidden = false;
  clearTimeout(toastT);
  toastT = setTimeout(function(){ toastEl.hidden = true; }, 2600);
}

/* ====================== BOOT ====================== */
function boot(data){
  DB.settings = data.settings && Object.keys(data.settings).length ? data.settings : JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
  DB.rates    = data.rates && Object.keys(data.rates).length ? data.rates : JSON.parse(JSON.stringify(DEFAULT_RATES));
  DB.boards   = (data.boards && data.boards.length) ? data.boards : JSON.parse(JSON.stringify(DEFAULT_BOARDS));
  DB.films    = (data.films && data.films.length) ? data.films : JSON.parse(JSON.stringify(DEFAULT_FILMS));
  DB.clients  = data.clients || [];
  DB.quotes   = data.quotes || [];
  DB.saved    = data.saved || {};

  if(!job.client_name && DB.clients.length){
    job.client_name = DB.clients[0].name;
    fillClientSilent(DB.clients[0]);
  }
  if(!job.product) job.product = '50 ml Serum Carton';

  document.getElementById('state').textContent = LIVE ? 'saving to your sheet' : 'demo — this browser only';
  document.getElementById('state').className = 'state ' + (LIVE ? 'live' : 'demo');

  renderPanel();
  renderAll();
}
function fillClientSilent(c){
  job.client_contact = c.contact || '';
  job.client_country = c.country || '';
  job.client_email = c.email || '';
  job.client_address = c.address || '';
}

if(LIVE){
  document.getElementById('state').textContent = 'loading…';
  google.script.run
    .withSuccessHandler(boot)
    .withFailureHandler(function(err){
      toast('Storage not ready — run "Set up / repair storage" in the sheet');
      boot({});
    })
    .getBootstrap();
} else {
  var saved = {};
  try{ saved = JSON.parse(localStorage.getItem(LS) || '{}') || {}; }catch(e){ saved = {}; }
  boot(saved);
}

})();
